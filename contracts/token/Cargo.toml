[package]
name = "token"
version = "0.1.0"
edition = "2021"
authors = ["mehtaranjana745-blip <mehtaranjana745@gmail.com>"]
description = "Reward token contract for the Soroban staking platform"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "26.0.0"

[dev-dependencies]
soroban-sdk = { version = "26.0.0", features = ["testutils"] }
